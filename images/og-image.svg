<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Source for og-image.png (social share preview). Re-render at 1200x630
    with headless Chrome's screenshot option, e.g. the headless, hide-scrollbars,
    window-size=1200,630 and screenshot=images/og-image.png flags.
  -->
  <defs>
    <!-- Same sun as favicon.svg, scaled 16x -->
    <linearGradient id="sun" x1="0" y1="123" x2="0" y2="507" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf500"/>
      <stop offset="0.55" stop-color="#ff71ce"/>
      <stop offset="1" stop-color="#bc13fe"/>
    </linearGradient>
    <clipPath id="bands">
      <rect y="0" width="1200" height="331"/>
      <rect y="355" width="1200" height="36"/>
      <rect y="415" width="1200" height="32"/>
      <rect y="471" width="1200" height="36"/>
    </clipPath>
    <radialGradient id="glow" cx="330" cy="315" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#bc13fe" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bc13fe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0d0b1e"/>
  <circle cx="330" cy="315" r="300" fill="url(#glow)"/>
  <circle cx="330" cy="315" r="192" fill="url(#sun)" clip-path="url(#bands)"/>

  <g font-family="Monaco, 'Bitstream Vera Sans Mono', 'Lucida Console', Menlo, monospace">
    <text x="600" y="290" font-size="56" font-weight="700" fill="#ece8ff">Olivia Baddeley</text>
    <text x="600" y="358" font-size="40" fill="#2de2e6">Developer</text>
    <text x="600" y="440" font-size="26" fill="#b8b0d9">oliviabaddeley.com</text>
  </g>
</svg>
